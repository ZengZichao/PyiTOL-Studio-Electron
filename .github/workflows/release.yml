name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build macOS app
        env:
          # The release artefact is ad-hoc signed unless a Developer ID
          # certificate is injected as CSC_LINK / CSC_KEY_PASSWORD.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac

      - uses: actions/upload-artifact@v4
        with:
          name: pyitol-studio-macos-arm64
          path: dist/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
