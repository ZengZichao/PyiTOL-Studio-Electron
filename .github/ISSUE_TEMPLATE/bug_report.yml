name: Bug report
description: Report a problem with PyiTOL Studio
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the sections below so we can reproduce it.
  - type: input
    id: version
    attributes:
      label: Version
      description: App version (see About dialog) or commit hash.
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS arm64
        - macOS Intel
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, sample files, and any project file that triggers the issue.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Sidecar stderr is logged as `[sidecar:stderr] …` when the app is started from a terminal. Paste relevant output or screenshots.
